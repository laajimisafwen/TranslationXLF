name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd extension && npm ci

      - name: Run unit tests
        run: cd extension && node talan-xlf-tests.js

  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd extension && npm ci

      - name: Bundle extension
        run: cd extension && node esbuild.js

      - name: Package VSIX
        run: cd extension && npx @vscode/vsce package --no-dependencies

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: talan-xlf-translator-vsix
          path: extension/*.vsix
          retention-days: 30

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan for exposed API keys
        run: |
          if grep -r "gsk_[A-Za-z0-9]\{50,\}" extension/dist/ 2>/dev/null; then
            echo "Groq key found!"
            exit 1
          fi
          if grep -r "AIzaSy[A-Za-z0-9_-]\{33,\}" extension/dist/ 2>/dev/null; then
            echo "Gemini key found!"
            exit 1
          fi
          echo "Security check passed"