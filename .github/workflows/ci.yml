name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ✅ Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        run: cd extension && node talan-xlf-tests.js

  package:
    name: 📦 Package VSIX
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install vsce only
        run: npm install -g @vscode/vsce

      - name: Get version from package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./extension/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package VSIX
        run: |
          cd extension
          vsce package --no-dependencies --allow-missing-repository
          ls -lh *.vsix

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talan-xlf-studio-v${{ steps.get_version.outputs.version }}
          path: extension/*.vsix
          retention-days: 90

  security:
    name: 🔐 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for exposed API keys
        run: |
          if grep -rE "gsk_[A-Za-z0-9]{50,}" extension/dist/ 2>/dev/null; then
            echo "❌ Groq key found in dist/"
            exit 1
          fi
          if grep -rE "AIzaSy[A-Za-z0-9_-]{33,}" extension/dist/ 2>/dev/null; then
            echo "❌ Gemini key found in dist/"
            exit 1
          fi
          echo "✅ No exposed keys found"