<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <defs>
    <linearGradient id="prog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
    <clipPath id="clip-prog"><rect width="700" height="6" rx="3"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" fill="#0d1117" rx="8"/>

  <!-- Header -->
  <rect width="900" height="44" fill="#161b22" rx="0"/>
  <rect width="900" height="1" y="43" fill="#30363d"/>
  <!-- TALAN logo text -->
  <text x="14" y="16" font-size="13" font-weight="800" letter-spacing="1">
    <tspan fill="#185FA5">T</tspan><tspan fill="#e6503a">A</tspan><tspan fill="#3fb950">L</tspan><tspan fill="#185FA5">A</tspan><tspan fill="#d29922">N</tspan>
  </text>
  <text x="14" y="32" font-size="10" fill="#6e7681">XLF Studio v2.0</text>
  <!-- Header buttons -->
  <rect x="720" y="10" width="70" height="24" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="755" y="26" font-size="11" fill="#8b949e" text-anchor="middle">📂 Open XLF</text>
  <rect x="797" y="10" width="96" height="24" rx="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
  <text x="845" y="26" font-size="11" fill="#fff" text-anchor="middle">⚡ Translate</text>

  <!-- Stats bar -->
  <rect y="44" width="900" height="52" fill="#161b22"/>
  <rect y="95" width="900" height="1" fill="#30363d"/>

  <!-- Stats -->
  <text x="24" y="66" font-size="22" font-weight="700" fill="#e6edf3">1 111</text>
  <text x="24" y="82" font-size="10" fill="#6e7681" letter-spacing=".04em">TOTAL</text>

  <text x="110" y="66" font-size="22" font-weight="700" fill="#3fb950">1 004</text>
  <text x="110" y="82" font-size="10" fill="#6e7681" letter-spacing=".04em">TRANSLATED</text>

  <text x="220" y="66" font-size="22" font-weight="700" fill="#d29922">0</text>
  <text x="220" y="82" font-size="10" fill="#6e7681" letter-spacing=".04em">PENDING</text>

  <text x="290" y="66" font-size="22" font-weight="700" fill="#a371f7">107</text>
  <text x="290" y="82" font-size="10" fill="#6e7681" letter-spacing=".04em">REVIEW</text>

  <text x="370" y="66" font-size="22" font-weight="700" fill="#f85149">0</text>
  <text x="370" y="82" font-size="10" fill="#6e7681" letter-spacing=".04em">ERRORS</text>

  <!-- Progress bar -->
  <rect x="430" y="63" width="380" height="6" rx="3" fill="#21262d"/>
  <rect x="430" y="63" width="342" height="6" rx="3" fill="url(#prog)"/>

  <!-- Score ring -->
  <circle cx="852" cy="70" r="22" fill="none" stroke="#21262d" stroke-width="4"/>
  <circle cx="852" cy="70" r="22" fill="none" stroke="#3fb950" stroke-width="4"
    stroke-dasharray="124 138" stroke-dashoffset="35" stroke-linecap="round"/>
  <text x="852" y="74" font-size="10" font-weight="700" fill="#3fb950" text-anchor="middle">90%</text>
  <text x="880" y="66" font-size="9" fill="#6e7681">fr-FR</text>
  <text x="880" y="78" font-size="9" fill="#6e7681">LANGUAGE</text>

  <!-- Tabs -->
  <rect y="96" width="900" height="36" fill="#161b22"/>
  <rect y="131" width="900" height="1" fill="#30363d"/>
  <text x="20" y="118" font-size="12" fill="#388bfd" font-weight="600">Editor</text>
  <rect x="14" y="129" width="46" height="2" fill="#388bfd" rx="1"/>
  <text x="80" y="118" font-size="12" fill="#8b949e">Validation</text>
  <text x="160" y="118" font-size="12" fill="#8b949e">BC Glossary</text>
  <text x="254" y="118" font-size="12" fill="#8b949e">API Keys</text>

  <!-- Toolbar -->
  <rect y="132" width="900" height="36" fill="#161b22"/>
  <rect y="167" width="900" height="1" fill="#30363d"/>
  <!-- Filter pills -->
  <rect x="14" y="142" width="32" height="20" rx="10" fill="#0d2044" stroke="#388bfd" stroke-width="1"/>
  <text x="30" y="156" font-size="11" fill="#388bfd" text-anchor="middle">All</text>
  <rect x="52" y="142" width="62" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="83" y="156" font-size="11" fill="#8b949e" text-anchor="middle">⏳ Pending</text>
  <rect x="120" y="142" width="76" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="158" y="156" font-size="11" fill="#8b949e" text-anchor="middle">✓ Translated</text>
  <rect x="202" y="142" width="60" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="232" y="156" font-size="11" fill="#8b949e" text-anchor="middle">👁 Review</text>
  <rect x="268" y="142" width="52" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="294" y="156" font-size="11" fill="#8b949e" text-anchor="middle">⚠ Errors</text>
  <!-- Search -->
  <rect x="336" y="141" width="220" height="22" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="346" y="156" font-size="11" fill="#6e7681">Search ID, source, target… (regex ok)</text>

  <!-- Table header -->
  <rect y="168" width="900" height="28" fill="#161b22"/>
  <rect y="195" width="900" height="1" fill="#30363d"/>
  <text x="20" y="186" font-size="11" fill="#6e7681" font-weight="600">#</text>
  <text x="48" y="186" font-size="11" fill="#6e7681" font-weight="600">OBJECT / ID</text>
  <text x="258" y="186" font-size="11" fill="#6e7681" font-weight="600">SOURCE (EN)</text>
  <text x="558" y="186" font-size="11" fill="#6e7681" font-weight="600">TARGET</text>
  <text x="840" y="186" font-size="11" fill="#6e7681" font-weight="600">STATE</text>

  <!-- Data rows -->
  <!-- Row 1 -->
  <rect y="196" width="900" height="36" fill="#0d1117"/>
  <rect y="231" width="900" height="1" fill="#21262d"/>
  <text x="20" y="218" font-size="11" fill="#6e7681">1</text>
  <text x="48" y="213" font-size="10" fill="#6e7681">Table 2054821479 · NamedType 19877…</text>
  <text x="258" y="213" font-size="11" fill="#e6edf3">Customer Name</text>
  <text x="558" y="213" font-size="11" fill="#e6edf3">Nom du client</text>
  <text x="840" y="213" font-size="11" fill="#3fb950">translated</text>

  <!-- Row 2 highlighted -->
  <rect y="232" width="900" height="36" fill="#0d2044"/>
  <rect y="267" width="900" height="1" fill="#21262d"/>
  <text x="20" y="254" font-size="11" fill="#6e7681">2</text>
  <text x="48" y="249" font-size="10" fill="#6e7681">Table 2054821479 · NamedType 21690…</text>
  <text x="258" y="249" font-size="11" fill="#e6edf3">Acquisition Channel</text>
  <rect x="552" y="238" width="260" height="22" rx="3" fill="#21262d" stroke="#388bfd" stroke-width="1"/>
  <text x="558" y="253" font-size="11" fill="#e6edf3">Canal d'acquisition</text>
  <text x="840" y="254" font-size="11" fill="#3fb950">translated</text>

  <!-- Row 3 -->
  <rect y="268" width="900" height="36" fill="#0d1117"/>
  <rect y="303" width="900" height="1" fill="#21262d"/>
  <text x="20" y="290" font-size="11" fill="#6e7681">3</text>
  <text x="48" y="285" font-size="10" fill="#6e7681">Table 2054821479 · NamedType 25079…</text>
  <text x="258" y="285" font-size="11" fill="#e6edf3">Phone No.</text>
  <text x="558" y="285" font-size="11" fill="#e6edf3">N° de téléphone</text>
  <text x="840" y="290" font-size="11" fill="#3fb950">translated</text>

  <!-- Row 4 NAB -->
  <rect y="304" width="900" height="36" fill="#2d1f00" opacity="0.5"/>
  <rect y="339" width="900" height="1" fill="#21262d"/>
  <text x="20" y="326" font-size="11" fill="#6e7681">4</text>
  <text x="48" y="321" font-size="10" fill="#6e7681">Table 2149127316 · Field 626598271…</text>
  <text x="258" y="321" font-size="11" fill="#e6edf3">this translation method is wonderful</text>
  <rect x="552" y="310" width="200" height="20" rx="3" fill="#2d1f00" stroke="#d29922" stroke-width="1"/>
  <text x="558" y="324" font-size="11" fill="#d29922">[NAB: NOT TRANSLATED]</text>
  <text x="840" y="326" font-size="11" fill="#d29922">pending</text>

  <!-- Row 5 -->
  <rect y="340" width="900" height="36" fill="#0d1117"/>
  <rect y="375" width="900" height="1" fill="#21262d"/>
  <text x="20" y="362" font-size="11" fill="#6e7681">5</text>
  <text x="48" y="357" font-size="10" fill="#6e7681">Report 2054821479 · NamedType 38992…</text>
  <text x="258" y="357" font-size="11" fill="#e6edf3">Description</text>
  <text x="558" y="357" font-size="11" fill="#e6edf3">Description</text>
  <text x="840" y="362" font-size="11" fill="#3fb950">translated</text>

  <!-- Row 6 -->
  <rect y="376" width="900" height="36" fill="#0d1117"/>
  <text x="20" y="398" font-size="11" fill="#6e7681">6</text>
  <text x="48" y="393" font-size="10" fill="#6e7681">Report 2054821479 · NamedType 21983…</text>
  <text x="258" y="393" font-size="11" fill="#e6edf3">%1 %2 must be specified.</text>
  <text x="558" y="393" font-size="11" fill="#e6edf3">%1 %2 doit être spécifié.</text>
  <text x="840" y="398" font-size="11" fill="#3fb950">translated</text>

  <!-- Footer scrollbar -->
  <rect x="888" y="168" width="6" height="312" rx="3" fill="#21262d"/>
  <rect x="888" y="168" width="6" height="60" rx="3" fill="#484f58"/>

  <!-- Border -->
  <rect width="900" height="480" fill="none" stroke="#30363d" stroke-width="1" rx="8"/>
</svg>
