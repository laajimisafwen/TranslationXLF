  <rect x="52" y="142" width="62" height="20" rx="10" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="83" y="156" font-size="11" fill="#8b949e" text-anchor="middle">⏳ Pending</text>

  <!-- Table header -->
  <rect y="168" width="600" height="28" fill="#161b22"/>
  <rect y="168" width="900" height="28" fill="#161b22"/>
  <rect y="195" width="900" height="1" fill="#30363d"/>
  <text x="20" y="186" font-size="11" fill="#6e7681" font-weight="600">#</text>
  <text x="48" y="186" font-size="11" fill="#6e7681" font-weight="600">OBJECT / ID</text>
  <text x="258" y="186" font-size="11" fill="#6e7681" font-weight="600">SOURCE (EN)</text>
  <text x="508" y="186" font-size="11" fill="#6e7681" font-weight="600">TARGET</text>
  <text x="790" y="186" font-size="11" fill="#6e7681" font-weight="600">STATE</text>

  <!-- Row 1 — source editing active -->
  <rect y="196" width="900" height="36" fill="#0d2044" opacity="0.6"/>
  <rect y="231" width="900" height="1" fill="#21262d"/>
  <text x="20" y="218" font-size="11" fill="#6e7681">81</text>
  <text x="48" y="213" font-size="10" fill="#6e7681">Report 2054821479 · NamedType 42149…</text>
  <!-- Source cell editing (blue border = modified) -->
  <rect x="252" y="200" width="248" height="24" rx="3" fill="#21262d" stroke="#388bfd" stroke-width="1.5"/>
  <rect x="252" y="200" width="3" height="24" fill="#388bfd" rx="1"/>
  <text x="260" y="216" font-size="11" fill="#388bfd">Sales Document: %1</text>
  <!-- Cursor blink -->
  <rect x="362" y="204" width="1" height="16" fill="#388bfd" opacity="0.9"/>
  <text x="508" y="218" font-size="11" fill="#e6edf3">Document vente %1</text>
  <text x="790" y="218" font-size="11" fill="#3fb950">translated</text>

  <!-- Row 2 -->
  <rect y="232" width="900" height="36" fill="#0d1117"/>
  <rect y="267" width="900" height="1" fill="#21262d"/>
  <text x="20" y="254" font-size="11" fill="#6e7681">82</text>
  <text x="48" y="249" font-size="10" fill="#6e7681">Report 2054821479 · NamedType 35772…</text>
  <text x="258" y="249" font-size="11" fill="#e6edf3">%1 must be %2.</text>
  <text x="508" y="249" font-size="11" fill="#e6edf3">%1 doit être %2.</text>
  <text x="790" y="254" font-size="11" fill="#3fb950">translated</text>

  <!-- Row 3 -->
  <rect y="268" width="900" height="36" fill="#0d1117"/>
  <rect y="303" width="900" height="1" fill="#21262d"/>
  <text x="20" y="290" font-size="11" fill="#6e7681">83</text>
  <text x="48" y="285" font-size="10" fill="#6e7681">Report 2054821479 · NamedType 11953…</text>
  <text x="258" y="285" font-size="11" fill="#e6edf3">%1 %2 does not exist on customer entries.</text>
  <text x="508" y="285" font-size="11" fill="#e6edf3">%1 %2 n'existe pas sur les entrées client.</text>
  <text x="790" y="290" font-size="11" fill="#3fb950">translated</text>

  <!-- Row 4 — target editing active -->
  <rect y="304" width="900" height="36" fill="#0d2044"/>
  <rect y="339" width="900" height="1" fill="#21262d"/>
  <text x="20" y="326" font-size="11" fill="#6e7681">84</text>
  <text x="48" y="321" font-size="10" fill="#6e7681">Report 2054821479 · NamedType 55765…</text>
  <text x="258" y="321" font-size="11" fill="#e6edf3">%1 %2 %3 does not exist.</text>
  <!-- Target editing textarea -->
  <rect x="502" y="308" width="268" height="24" rx="3" fill="#21262d" stroke="#388bfd" stroke-width="1.5"/>
  <text x="508" y="324" font-size="11" fill="#e6edf3">Le %1 %2 n'existe pas.</text>
  <rect x="610" y="312" width="1" height="16" fill="#388bfd" opacity="0.9"/>
  <text x="790" y="326" font-size="11" fill="#3fb950">translated</text>

  <!-- Row 5 -->
  <rect y="340" width="900" height="36" fill="#0d1117"/>
  <rect y="375" width="900" height="1" fill="#21262d"/>
  <text x="20" y="362" font-size="11" fill="#6e7681">85</text>
  <text x="48" y="357" font-size="10" fill="#6e7681">Report 2054821479 · NamedType 85753…</text>
  <text x="258" y="357" font-size="11" fill="#e6edf3">Receive and Credit Memo</text>
  <text x="508" y="357" font-size="11" fill="#e6edf3">Réception et note de crédit</text>
  <text x="790" y="362" font-size="11" fill="#3fb950">translated</text>

  <!-- Row 6 -->
  <rect y="376" width="900" height="36" fill="#0d1117"/>
  <text x="20" y="398" font-size="11" fill="#6e7681">86</text>
  <text x="48" y="393" font-size="10" fill="#6e7681">Report 2054821479 · NamedType 21983…</text>
  <text x="258" y="393" font-size="11" fill="#e6edf3">%1 %2 must be specified.</text>
  <text x="508" y="393" font-size="11" fill="#e6edf3">%1 %2 doit être spécifié.</text>
  <text x="790" y="398" font-size="11" fill="#3fb950">translated</text>

  <!-- Tooltip for source edit -->
  <rect x="110" y="196" width="140" height="24" rx="4" fill="#1f6feb" opacity="0.95"/>
  <text x="180" y="212" font-size="10" fill="#fff" text-anchor="middle">✏️ Source éditable — clic</text>

  <!-- Border -->
  <rect width="900" height="480" fill="none" stroke="#30363d" stroke-width="1" rx="8"/>
</svg>
