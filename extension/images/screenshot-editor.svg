<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <!-- Background -->
  <rect width="900" height="480" fill="#0d1117" rx="8"/>

  <!-- Header -->
  <rect width="900" height="44" fill="#161b22"/>
  <rect width="900" height="1" y="43" fill="#30363d"/>
  <text x="14" y="16" font-size="13" font-weight="800" letter-spacing="1">
    <tspan fill="#185FA5">T</tspan><tspan fill="#e6503a">A</tspan><tspan fill="#3fb950">L</tspan><tspan fill="#185FA5">A</tspan><tspan fill="#d29922">N</tspan>
  </text>
  <text x="14" y="32" font-size="10" fill="#6e7681">XLF Studio v2.0</text>
  <rect x="740" y="10" width="96" height="24" rx="6" fill="#1f6feb" stroke="#388bfd" stroke-width="1"/>
  <text x="788" y="26" font-size="11" fill="#fff" text-anchor="middle">⚡ Translate Pending</text>
  <rect x="843" y="10" width="50" height="24" rx="6" fill="#0d2818" stroke="#3fb950" stroke-width="1"/>
  <text x="868" y="26" font-size="11" fill="#3fb950" text-anchor="middle">✅ Export</text>

  <!-- Stats bar -->
  <rect y="44" width="900" height="52" fill="#161b22"/>
  <rect y="95" width="900" height="1" fill="#30363d"/>
  <text x="24" y="66" font-size="22" font-weight="700" fill="#e6edf3">417</text>
  <text x="24" y="82" font-size="10" fill="#6e7681" letter-spacing=".04em">TOTAL</text>
  <text x="90" y="66" font-size="22" font-weight="700" fill="#3fb950">417</text>
  <text x="90" y="82" font-size="10" fill="#6e7681" letter-spacing=".04em">TRANSLATED</text>
  <text x="180" y="66" font-size="22" font-weight="700" fill="#d29922">0</text>
  <text x="180" y="82" font-size="10" fill="#6e7681" letter-spacing=".04em">PENDING</text>
  <text x="240" y="66" font-size="22" font-weight="700" fill="#a371f7">0</text>
  <text x="240" y="82" font-size="10" fill="#6e7681" letter-spacing=".04em">REVIEW</text>
  <text x="300" y="66" font-size="22" font-weight="700" fill="#f85149">1</text>
  <text x="300" y="82" font-size="10" fill="#6e7681" letter-spacing=".04em">ERRORS</text>
  <rect x="360" y="63" width="440" height="6" rx="3" fill="#21262d"/>
  <rect x="360" y="63" width="440" height="6" rx="3" fill="url(#prog2)"/>
  <defs>
    <linearGradient id="prog2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#3fb950"/>
    </linearGradient>
  </defs>
  <circle cx="840" cy="70" r="22" fill="none" stroke="#21262d" stroke-width="4"/>
  <circle cx="840" cy="70" r="22" fill="none" stroke="#3fb950" stroke-width="4"
    stroke-dasharray="138 138" stroke-dashoffset="35" stroke-linecap="round"/>
  <text x="840" y="74" font-size="10" font-weight="700" fill="#3fb950" text-anchor="middle">100%</text>
  <text x="866" y="66" font-size="9" fill="#6e7681">fr-FR</text>

  <!-- Tabs -->
  <rect y="96" width="900" height="36" fill="#161b22"/>
  <rect y="131" width="900" height="1" fill="#30363d"/>
  <text x="20" y="118" font-size="12" fill="#388bfd" font-weight="600">Editor</text>
  <rect x="14" y="129" width="46" height="2" fill="#388bfd" rx="1"/>
  <text x="80" y="118" font-size="12" fill="#8b949e">Validation</text>
  <text x="160" y="118" font-size="12" fill="#8b949e">BC Glossary</text>
  <text x="254" y="118" font-size="12" fill="#8b949e">API Keys</text>

  <!-- Toolbar -->
  <rect y="132" width="900" height="36" fill="#161b22"/>
  <rect y="167" width="900" height="1" fill="#30363d"/>
  <rect x="14" y="142" width="32" height="20" rx="10" fill="#0d2044" stroke="#388bfd" stroke-width="1"/>
